<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nasze inwestycje</title>
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15181f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inwestycje">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Przejdź do treści</a>
  <div id="loading" class="center-screen"><div class="spinner" role="status" aria-label="Wczytywanie"></div></div>

  <div id="login" class="center-screen" hidden>
    <form id="login-form" class="card login-card">
      <img src="icon.svg" alt="" width="56" height="56">
      <h1>Nasze inwestycje</h1>
      <p class="tagline">Portfel i mieszkanie, razem</p>
      <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
      <label>Hasło<input type="password" name="password" autocomplete="current-password" required></label>
      <p class="error" role="alert" hidden></p>
      <button class="primary" type="submit">Zaloguj się</button>
    </form>
  </div>

  <div id="app" hidden>
    <nav class="tabs" aria-label="Sekcje">
      <button data-tab="overview"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Przegląd</button>
      <button data-tab="goal"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6"/></svg>Mieszkanie</button>
      <button data-tab="history"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9M15 7h5v5"/></svg>Historia</button>
      <button data-tab="activity"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Transakcje</button>
    </nav>
    <header class="top">
      <h1 id="page-title" aria-live="polite">Przegląd</h1>
      <button id="refresh" class="icon-btn" title="Odśwież dane" aria-label="Odśwież dane">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
    </header>
    <main id="main" tabindex="-1">
      <section id="tab-overview" class="tab"></section>
      <section id="tab-goal" class="tab" hidden></section>
      <section id="tab-history" class="tab" hidden></section>
      <section id="tab-activity" class="tab" hidden></section>
    </main>
  </div>

  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
